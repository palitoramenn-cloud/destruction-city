<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DESTRUCTION CITY</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#9bc7e8;font-family:Arial;color:white}#hud{position:fixed;z-index:2;top:10px;left:10px;padding:12px;background:#111d;border:1px solid #ffffff44;border-radius:12px;max-width:calc(100% - 20px)}h1{margin:0 0 7px;color:#fb7629;font-size:19px}#msg{font-size:12px;margin-top:5px;color:#fde68a}.buttons{position:fixed;right:10px;bottom:12px;z-index:3;display:flex;flex-direction:column;gap:7px}button{border:1px solid #fed7aa;border-radius:10px;background:#c2410c;color:white;font-weight:bold;padding:12px;font-size:14px;touch-action:manipulation}#move{position:fixed;left:10px;bottom:12px;z-index:3;display:grid;grid-template-columns:repeat(3,44px);gap:4px}#move button{padding:12px 0;background:#26374dcc}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#ff672e;font-size:22px;pointer-events:none}
</style></head><body><div id="hud"><h1>💥 DESTRUCTION CITY</h1><div>Edificios destruidos: <b id="count">0</b></div><div id="msg">Arrastra la pantalla para mirar.</div><div style="font-size:11px;margin-top:5px">PC: WASD mover · ratón mirar · clic láser · B bomba · E onda</div></div><div id="cross">+</div><div id="move"><span></span><button data-m="f">⬆</button><span></span><button data-m="l">⬅</button><button data-m="b">⬇</button><button data-m="r">➡</button></div><div class="buttons"><button id="laser">⚡ LÁSER</button><button id="bomb">💣 BOMBA</button><button id="shock">🌊 ONDA</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc7e8);scene.fog=new THREE.Fog(0x9bc7e8,75,210);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);camera.position.set(0,2,16);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe4f6ff,0x4b5563,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(35,60,20);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x555d64,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.13;ground.receiveShadow=true;scene.add(ground);const roadmat=new THREE.MeshStandardMaterial({color:0x252a30});for(let i=-5;i<=5;i++){let r=new THREE.Mesh(new THREE.PlaneGeometry(6,300),roadmat);r.rotation.x=-Math.PI/2;r.position.set(i*22,-.09,0);scene.add(r);let r2=new THREE.Mesh(new THREE.PlaneGeometry(300,6),roadmat);r2.rotation.x=-Math.PI/2;r2.position.set(0,-.09,i*22);scene.add(r2);for(let z=-140;z<150;z+=12){let d=new THREE.Mesh(new THREE.PlaneGeometry(.14,4),new THREE.MeshBasicMaterial({color:0xfacc15}));d.rotation.x=-Math.PI/2;d.position.set(i*22,-.06,z);scene.add(d)}}const buildings=[],palette=[0x9ca3af,0xcbd5e1,0xd6bda2,0x8fa3b8,0x8f9b8a,0xb8a4a0,0xd1d5db];for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){if(Math.abs(x)%2===0&&Math.abs(z)%2===0)continue;const w=7+Math.random()*4,d=7+Math.random()*4,h=8+Math.random()*28,g=new THREE.Group();g.position.set(x*22+(Math.random()-.5)*4,0,z*22+(Math.random()-.5)*4);const mat=new THREE.MeshStandardMaterial({color:palette[Math.floor(Math.random()*palette.length)],roughness:.8});const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;g.add(body);const wm=new THREE.MeshStandardMaterial({color:0x6aabc7,emissive:0x112c3b,metalness:.2});for(let y=2;y<h-1;y+=3)for(let xx=-w/2+1;xx<w/2-.5;xx+=2)for(const side of [-1,1]){const win=new THREE.Mesh(new THREE.BoxGeometry(.9,1.2,.07),wm);win.position.set(xx,y,side*(d/2+.04));g.add(win)}scene.add(g);buildings.push({g,body,hp:3,alive:true})}let yaw=0,pitch=0,destroyed=0,drag=false,lx=0,ly=0;const keys={},moving={f:false,b:false,l:false,r:false},effects=[];const msg=document.getElementById('msg');addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='b')bomb();if(e.key.toLowerCase()==='e')shock()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.004;pitch-= (e.clientY-ly)*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch));lx=e.clientX;ly=e.clientY});document.querySelectorAll('[data-m]').forEach(b=>{const k=b.dataset.m;b.addEventListener('pointerdown',e=>{e.preventDefault();moving[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>moving[k]=false))});const ray=new THREE.Raycaster();function target(){camera.rotation.order='YXZ';ray.setFromCamera(new THREE.Vector2(0,0),camera);const hit=ray.intersectObjects(buildings.filter(b=>b.alive).map(b=>b.body))[0];return hit?buildings.find(b=>b.body===hit.object):null}
function damage(b,n=1){if(!b||!b.alive)return;b.hp-=n;b.body.material.color.setHex(0xf97316);if(b.hp<=0){b.alive=false;destroyed++;document.getElementById('count').textContent=destroyed;scene.remove(b.g);const p=b.body.geometry.parameters,w=p.width,h=p.height,d=p.depth,base=b.body.material.color.clone(),count=38+Math.floor(Math.random()*18);for(let i=0;i<count;i++){const fw=Math.min(w*.45,.45+Math.random()*1.5),fh=Math.min(h*.3,.4+Math.random()*2.2),fd=Math.min(d*.45,.45+Math.random()*1.5),m=new THREE.Mesh(new THREE.BoxGeometry(fw,fh,fd),new THREE.MeshStandardMaterial({color:base.clone().multiplyScalar(.72+Math.random()*.45),roughness:.95}));m.position.copy(b.g.position).add(new THREE.Vector3((Math.random()-.5)*w,Math.random()*h,(Math.random()-.5)*d));m.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);const v=m.position.clone().sub(b.g.position);v.y=Math.random()*.8+.25;if(v.lengthSq()<.01)v.set(Math.random()-.5,1,Math.random()-.5);v.normalize().multiplyScalar(.12+Math.random()*.38);m.userData.v=v;m.userData.spin=new THREE.Vector3((Math.random()-.5)*.12,(Math.random()-.5)*.12,(Math.random()-.5)*.12);scene.add(m);effects.push({m,life:220+Math.floor(Math.random()*100),frag:true})}msg.textContent='¡Edificio colapsado! '+count+' fragmentos y escombros.'}else msg.textContent='¡Impacto! Resistencia: '+b.hp}
function beam(){const b=target();if(b)damage(b);else msg.textContent='Apunta al centro de un edificio.';const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion),m=new THREE.Mesh(new THREE.CylinderGeometry(.035,.08,12,8),new THREE.MeshBasicMaterial({color:0xff3b30,transparent:true,opacity:.8}));m.position.copy(camera.position).add(dir.clone().multiplyScalar(6));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);scene.add(m);effects.push({m,life:10})}function burst(pos,color){const m=new THREE.Mesh(new THREE.SphereGeometry(1,18,12),new THREE.MeshBasicMaterial({color,wireframe:true,transparent:true,opacity:.8}));m.position.copy(pos);scene.add(m);effects.push({m,life:35,burst:true})}function bomb(){const p=camera.position.clone().add(new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).multiplyScalar(12));p.y=0;burst(p,0xff6b00);let hits=0;buildings.forEach(b=>{if(b.alive&&b.g.position.distanceTo(p)<20){damage(b,3);hits++}});msg.textContent='¡BOMBA! Objetivos alcanzados: '+hits}function shock(){burst(camera.position.clone(),0x38bdf8);let hits=0;buildings.forEach(b=>{if(b.alive&&b.g.position.distanceTo(camera.position)<32){damage(b,1);hits++}});msg.textContent='¡Onda expansiva! '+hits+' edificios afectados'}document.getElementById('laser').onclick=beam;document.getElementById('bomb').onclick=bomb;document.getElementById('shock').onclick=shock;renderer.domElement.addEventListener('click',()=>{if(!('ontouchstart'in window))beam()});function animate(){requestAnimationFrame(animate);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),s=.24;if(keys.w||moving.f)camera.position.addScaledVector(f,s);if(keys.s||moving.b)camera.position.addScaledVector(f,-s);if(keys.a||moving.l)camera.position.addScaledVector(r,-s);if(keys.d||moving.r)camera.position.addScaledVector(r,s);camera.position.y=2;for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life--;if(e.frag){e.m.position.add(e.m.userData.v);e.m.userData.v.y-=.012;e.m.userData.v.x*=.995;e.m.userData.v.z*=.995;if(e.m.userData.spin){e.m.rotation.x+=e.m.userData.spin.x;e.m.rotation.y+=e.m.userData.spin.y;e.m.rotation.z+=e.m.userData.spin.z}if(e.m.position.y<.25){e.m.position.y=.25;e.m.userData.v.y=Math.abs(e.m.userData.v.y)*.28;e.m.userData.v.x*=.72;e.m.userData.v.z*=.72;if(Math.abs(e.m.userData.v.y)<.025)e.m.userData.v.y=0}}else if(e.burst){e.m.scale.setScalar(Math.max(.1,(35-e.life)*.8));e.m.material.opacity=Math.max(0,e.life/40)}if(e.life<=0){scene.remove(e.m);e.m.geometry.dispose();e.m.material.dispose();effects.splice(i,1)}}renderer.render(scene,camera)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate()})();
</script></body></html>
